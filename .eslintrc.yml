env:
  browser: true
  es2022: true
  node: true
  jest: true
extends:
  - "eslint:recommended"
  - "plugin:@typescript-eslint/eslint-recommended"
  - "plugin:@typescript-eslint/recommended"
  - "plugin:react/recommended"
  - "plugin:react-hooks/recommended"
  - "plugin:jest/recommended"
  # Must stay last so it can turn off stylistic rules that conflict with prettier.
  # `prettier/react` and `prettier/@typescript-eslint` were folded into this
  # single config in eslint-config-prettier v8 and no longer exist as separate entries.
  - "plugin:prettier/recommended"
parser: "@typescript-eslint/parser"
parserOptions:
  ecmaFeatures:
    jsx: true
  ecmaVersion: 2022
  sourceType: module
settings:
  react:
    version: detect
plugins:
  - react
  - react-hooks
  - "@typescript-eslint"
  - prettier
  - jest
rules:
  "@typescript-eslint/no-explicit-any": "off"
  "@typescript-eslint/no-unused-vars":
    ["warn", {argsIgnorePattern: "^_", varsIgnorePattern: "^_", ignoreRestSiblings: true}]
  "@typescript-eslint/ban-ts-comment": "off"
  "@typescript-eslint/no-empty-function": "off"
  "@typescript-eslint/no-unsafe-function-type": "off"
  # The public API has always typed callbacks as `Function`. Tightening it would
  # be a source-breaking change for consumers for no runtime benefit.
  "@typescript-eslint/ban-types": "off"
  react/prop-types: "off"
